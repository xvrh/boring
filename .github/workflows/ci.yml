name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # weekly

jobs:
  dart-ci:
    name: Dart Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Dependencies
        run: dart pub get

      - name: Verify Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Code
        run: dart analyze lib test tool hook example --fatal-infos

  test:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The tree-shaking test runs hook/link.dart (native and cross-compiled),
        # whose linker invocation differs per OS.
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Setup NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Install Linux Cross Toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install Linux Cross Toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install messense/macos-cross-toolchains/aarch64-unknown-linux-gnu

      - name: Install Linux Cross Toolchain (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fSL -o "$RUNNER_TEMP/arm-gnu-toolchain.zip" \
            "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-mingw-w64-x86_64-aarch64-none-linux-gnu.zip"
          7z x "$RUNNER_TEMP/arm-gnu-toolchain.zip" -o"$RUNNER_TEMP/arm-gnu-toolchain" -y >/dev/null
          BIN_DIR="$RUNNER_TEMP/arm-gnu-toolchain/bin"
          for f in "$BIN_DIR"/aarch64-none-linux-gnu-*.exe; do
            cp "$f" "${f/aarch64-none-linux-gnu-/aarch64-linux-gnu-}"
          done
          cygpath -w "$BIN_DIR" >> "$GITHUB_PATH"

      - name: Install Dependencies
        run: dart pub get

      - name: Run Unit Tests
        run: dart test

  android:
    name: Android Build (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # No release carries a prebuilt Android library, so hook/build.dart
        # always builds these from source. x86 is left out: its link misses
        # bn_mul_mont_words, because sources.cmake lists x86-mont-linux.S
        # under x86_64.
        abi: [armeabi-v7a, arm64-v8a, x86_64, riscv64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build BoringSSL with the NDK
        env:
          ABI: ${{ matrix.abi }}
        run: |
          cmake -S src -B "build/android-$ABI" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ABI" \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "build/android-$ABI"

  conformance:
    name: Project Wycheproof Conformance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Dependencies
        run: dart pub get

      - name: Run Conformance Test Suite
        run: ./tool/run_conformance_tests.sh

  x509-limbo:
    name: x509-limbo Path Validation Conformance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Dependencies
        run: dart pub get

      # limbo.json is ~40 MB, and the revision is pinned in the runner script.
      - name: Cache x509-limbo Testcases
        uses: actions/cache@v4
        with:
          path: build/x509-limbo
          key: x509-limbo-${{ hashFiles('tool/run_x509_limbo_tests.sh') }}

      - name: Run x509-limbo Test Suite
        run: ./tool/run_x509_limbo_tests.sh

  # Job to check for new BoringSSL updates
  refresh-check:
    name: Refresh BoringSSL
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: dev

      - name: Install Dependencies
        run: dart pub get

      - name: Run refresh script
        id: refresh
        run: ./tool/bump-boringssl-revision.sh

      - name: Check for changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain .)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install changelog updater
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          dart install --git-path pkgs/repo_manage https://github.com/dart-lang/ecosystem.git
          echo "$HOME/.local/state/Dart/install/bin" >> "$GITHUB_PATH"

      - name: Update changelog
        if: steps.check_changes.outputs.changed == 'true'
        run: report changelog "Update BoringSSL to ${STEPS_REFRESH_OUTPUTS_SHORT_REVISION}."
        env:
          STEPS_REFRESH_OUTPUTS_SHORT_REVISION: ${{ steps.refresh.outputs.short_revision }}

      - name: Create Pull Request
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Update BoringSSL to ${{ steps.refresh.outputs.short_revision }}"
          branch: "update-boringssl-${{ steps.refresh.outputs.short_revision }}"
          title: "[bump-boringssl-revision.sh] Update BoringSSL to ${{ steps.refresh.outputs.short_revision }}"
          body: |
            Automated update to the latest BoringSSL revision [`${{ steps.refresh.outputs.revision }}`](https://boringssl.googlesource.com/boringssl/+/${{ steps.refresh.outputs.revision }}).
          delete-branch: true
